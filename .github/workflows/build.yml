name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenGL
            project: MuWinGL/MuWinGL.csproj
            framework: MonoGame.Framework.DesktopGL
            artifact: muonline-windows-opengl
          - name: DirectX
            project: MuWinDX/MuWinDX.csproj
            framework: MonoGame.Framework.WindowsDX
            artifact: muonline-windows-directx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - name: Restore tools
        run: dotnet tool restore
      - name: Publish Windows build
        run: dotnet publish ${{ matrix.project }} -c Release -r win-x64 -o publish-${{ matrix.name }} -p:MonoGameFramework=${{ matrix.framework }}
      - name: Archive build
        run: Compress-Archive -Path publish-${{ matrix.name }}\* -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: |
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;27.2.12479018
          accept-android-sdk-licenses: true
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Publish Android APK
        run: dotnet publish MuAndroid/MuAndroid.csproj -c Release -f net10.0-android -o publish-android -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT -p:AcceptAndroidSDKLicenses=true
      - name: Verify APK exists
        shell: pwsh
        run: |
          $apk = Get-ChildItem publish-android -Filter *.apk -Recurse
          if (-not $apk) { throw "dotnet publish completed but no APK was produced." }
          Compress-Archive -Path $apk.FullName -DestinationPath muonline-android.zip
      - uses: actions/upload-artifact@v4
        with:
          name: muonline-android
          path: muonline-android.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - run: dotnet tool restore
      - name: Publish Linux build
        run: dotnet publish MuLinux/MuLinux.csproj -c Release -r linux-x64 -o publish-linux
      - name: Archive build
        run: cd publish-linux && zip -r ../muonline-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: muonline-linux
          path: muonline-linux.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - run: dotnet tool restore
      - name: Publish macOS build
        run: dotnet publish MuMac/MuMac.csproj -c Release -r osx-arm64 -o publish-macos
      - name: Archive build
        run: cd publish-macos && zip -r ../muonline-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: muonline-macos
          path: muonline-macos.zip
          if-no-files-found: error

  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - name: Install iOS workload
        run: dotnet workload install ios
      - run: dotnet tool restore
      - name: Build iOS simulator target
        run: dotnet build MuIos/MuIos.csproj -c Release -f net10.0-ios -r iossimulator-arm64 -p:EnableCodeSigning=false
      - name: Archive simulator output
        run: |
          OUTPUT="MuIos/bin/Release/net10.0-ios/iossimulator-arm64"
          test -d "$OUTPUT"
          cd "$OUTPUT"
          zip -r "$GITHUB_WORKSPACE/muonline-ios-simulator.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: muonline-ios-simulator
          path: muonline-ios-simulator.zip
          if-no-files-found: error

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-windows, build-android, build-linux, build-macos, build-ios-simulator]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: muonline-*
          path: artifacts
          merge-multiple: true
      - name: Prepare site
        run: |
          mkdir -p site
          cp artifacts/* site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MU Online builds</title></head>
          <body><main><h1>MU Online client builds</h1>
          <p>These are build artifacts, not a guarantee that a compatible game server is configured.</p>
          <ul>
          <li><a href="muonline-windows-opengl.zip">Windows OpenGL</a></li>
          <li><a href="muonline-windows-directx.zip">Windows DirectX</a></li>
          <li><a href="muonline-android.zip">Android APK</a></li>
          <li><a href="muonline-linux.zip">Linux</a></li>
          <li><a href="muonline-macos.zip">macOS</a></li>
          <li><a href="muonline-ios-simulator.zip">iOS Simulator (not installable on a physical iPhone)</a></li>
          </ul></main></body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
